<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagination และ DTO</title><style>body{margin:0;padding:24px;font-family:system-ui,sans-serif}h1{font-size:24px}.diagram-container{max-width:100%;min-width:0;width:100%;overflow-x:auto}@media print{.diagram-container{overflow-x:visible}}</style><h1>Pagination และ DTO ในหนึ่ง request</h1><p>Architecture · fit · 800×600 · 6 nodes · สีและฟอนต์จากเว็บ INT161 · ไม่ต้องโหลดฟอนต์ออนไลน์</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="dd-api" viewBox="0 0 800 600" role="img" aria-labelledby="pagination-dto-title pagination-dto-desc">
